<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172338"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#0b1120"/>

  <!-- Web Portal -->
  <g transform="translate(60,80)">
    <rect width="230" height="140" rx="18" fill="url(#nodeGrad)" stroke="#1f2f4a"/>
    <text x="115" y="45" text-anchor="middle" fill="#38bdf8" font-family="Poppins,sans-serif" font-size="30">🖥️</text>
    <text x="115" y="80" text-anchor="middle" fill="#ffffff" font-family="Poppins,sans-serif" font-size="19" font-weight="600">Web Portal</text>
    <text x="115" y="102" text-anchor="middle" fill="#94a3b8" font-family="Poppins,sans-serif" font-size="13">React + Vite</text>
    <text x="115" y="120" text-anchor="middle" fill="#94a3b8" font-family="Poppins,sans-serif" font-size="13">generates QR (60s)</text>
  </g>

  <!-- Backend -->
  <g transform="translate(485,80)">
    <rect width="230" height="140" rx="18" fill="url(#nodeGrad)" stroke="#1f2f4a"/>
    <text x="115" y="45" text-anchor="middle" fill="#38bdf8" font-family="Poppins,sans-serif" font-size="30">🗄️</text>
    <text x="115" y="80" text-anchor="middle" fill="#ffffff" font-family="Poppins,sans-serif" font-size="19" font-weight="600">Node.js Backend</text>
    <text x="115" y="102" text-anchor="middle" fill="#94a3b8" font-family="Poppins,sans-serif" font-size="13">Express + Socket.io</text>
    <text x="115" y="120" text-anchor="middle" fill="#94a3b8" font-family="Poppins,sans-serif" font-size="13">session store (UUID)</text>
  </g>

  <!-- Android App -->
  <g transform="translate(910,80)">
    <rect width="230" height="140" rx="18" fill="url(#nodeGrad)" stroke="#1f2f4a"/>
    <text x="115" y="45" text-anchor="middle" fill="#38bdf8" font-family="Poppins,sans-serif" font-size="30">📱</text>
    <text x="115" y="80" text-anchor="middle" fill="#ffffff" font-family="Poppins,sans-serif" font-size="19" font-weight="600">Android App</text>
    <text x="115" y="102" text-anchor="middle" fill="#94a3b8" font-family="Poppins,sans-serif" font-size="13">Kotlin + BiometricPrompt</text>
    <text x="115" y="120" text-anchor="middle" fill="#94a3b8" font-family="Poppins,sans-serif" font-size="13">scans QR + fingerprint</text>
  </g>

  <!-- Dashboard -->
  <g transform="translate(485,420)">
    <rect width="230" height="140" rx="18" fill="url(#nodeGrad)" stroke="#1f2f4a"/>
    <text x="115" y="45" text-anchor="middle" fill="#38bdf8" font-family="Poppins,sans-serif" font-size="30">✅</text>
    <text x="115" y="80" text-anchor="middle" fill="#ffffff" font-family="Poppins,sans-serif" font-size="19" font-weight="600">Student Dashboard</text>
    <text x="115" y="102" text-anchor="middle" fill="#94a3b8" font-family="Poppins,sans-serif" font-size="13">redirected instantly</text>
    <text x="115" y="120" text-anchor="middle" fill="#94a3b8" font-family="Poppins,sans-serif" font-size="13">no password entered</text>
  </g>

  <!-- Arrows -->
  <path d="M290 150 H480" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="385" y="140" text-anchor="middle" fill="#cbd5e1" font-family="Poppins,sans-serif" font-size="13">1. generate-session</text>

  <path d="M715 150 H905" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="810" y="140" text-anchor="middle" fill="#cbd5e1" font-family="Poppins,sans-serif" font-size="13">2. scan QR</text>

  <path d="M1025 220 C 1025 320, 750 320, 715 130" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="905" y="300" text-anchor="middle" fill="#cbd5e1" font-family="Poppins,sans-serif" font-size="13">3. verify-scan (after fingerprint)</text>

  <path d="M600 220 V415" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="330" text-anchor="middle" fill="#cbd5e1" font-family="Poppins,sans-serif" font-size="13">4. socket.io</text>
  <text x="600" y="348" text-anchor="middle" fill="#cbd5e1" font-family="Poppins,sans-serif" font-size="13">auth-success event</text>

  <text x="600" y="600" text-anchor="middle" fill="#64748b" font-family="Poppins,sans-serif" font-size="13">No password is ever entered, stored, or transmitted — approval happens on-device via biometrics.</text>
</svg>
