<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1b30"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#bgGrad)"/>
  <circle cx="500" cy="380" r="420" fill="url(#glow)"/>

  <!-- ===== QR code block (top left) ===== -->
  <g transform="translate(150,150)">
    <rect x="0" y="0" width="260" height="260" rx="20" fill="#0b1120" stroke="#1f2f4a" stroke-width="2"/>
    <!-- corner markers -->
    <g fill="#38bdf8">
      <rect x="20" y="20" width="55" height="55" rx="8"/>
      <rect x="185" y="20" width="55" height="55" rx="8"/>
      <rect x="20" y="185" width="55" height="55" rx="8"/>
    </g>
    <g fill="#0b1120">
      <rect x="35" y="35" width="25" height="25" rx="4"/>
      <rect x="200" y="35" width="25" height="25" rx="4"/>
      <rect x="35" y="200" width="25" height="25" rx="4"/>
    </g>
    <!-- scattered data dots -->
    <g fill="#cbd5e1">
      <rect x="100" y="30" width="14" height="14"/>
      <rect x="130" y="30" width="14" height="14"/>
      <rect x="100" y="55" width="14" height="14"/>
      <rect x="160" y="60" width="14" height="14"/>
      <rect x="30" y="105" width="14" height="14"/>
      <rect x="60" y="105" width="14" height="14"/>
      <rect x="100" y="105" width="14" height="14" fill="#38bdf8"/>
      <rect x="135" y="105" width="14" height="14"/>
      <rect x="165" y="105" width="14" height="14"/>
      <rect x="195" y="105" width="14" height="14"/>
      <rect x="100" y="135" width="14" height="14"/>
      <rect x="160" y="135" width="14" height="14"/>
      <rect x="195" y="135" width="14" height="14"/>
      <rect x="100" y="165" width="14" height="14"/>
      <rect x="130" y="165" width="14" height="14"/>
      <rect x="160" y="195" width="14" height="14"/>
      <rect x="195" y="195" width="14" height="14"/>
      <rect x="130" y="200" width="14" height="14"/>
    </g>
  </g>

  <!-- ===== connecting pulse line ===== -->
  <path d="M 410 280 C 520 260, 560 380, 660 400" stroke="#38bdf8" stroke-width="3" fill="none" stroke-dasharray="8 10" opacity="0.7"/>
  <circle cx="410" cy="280" r="6" fill="#38bdf8"/>
  <circle cx="660" cy="400" r="6" fill="#38bdf8"/>

  <!-- ===== Fingerprint (right side) ===== -->
  <g transform="translate(640,230)" stroke="url(#accentGrad)" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M90 20 C 40 20, 5 60, 5 105 C5 140, 5 160, 15 185"/>
    <path d="M65 15 C 115 10, 165 45, 170 100 C172 130, 170 150, 165 175" opacity="0.85"/>
    <path d="M40 40 C 25 60, 22 85, 25 115 C 28 145, 35 165, 45 190" opacity="0.7"/>
    <path d="M110 35 C 140 45, 150 75, 148 110 C146 140, 140 160, 130 180" opacity="0.6"/>
    <path d="M60 60 C 50 78, 50 100, 55 125 C 60 150, 68 165, 78 180" opacity="0.9"/>
    <path d="M95 55 C 118 65, 125 90, 120 118 C 117 142, 108 158, 100 170" opacity="0.5"/>
  </g>

  <!-- ===== Lock badge (bottom) ===== -->
  <g transform="translate(415,560)">
    <circle cx="85" cy="85" r="85" fill="#0b1120" stroke="#1f2f4a" stroke-width="2"/>
    <rect x="50" y="80" width="70" height="55" rx="10" fill="url(#accentGrad)"/>
    <path d="M62 80 v-18 a23 23 0 0 1 46 0 v18" stroke="url(#accentGrad)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="85" cy="105" r="8" fill="#0b1120"/>
    <rect x="81" y="108" width="8" height="16" rx="3" fill="#0b1120"/>
  </g>

  <!-- ===== Title ===== -->
  <text x="500" y="880" text-anchor="middle" fill="#ffffff" font-family="Poppins, sans-serif" font-size="46" font-weight="700">Passwordless Auth</text>
  <text x="500" y="922" text-anchor="middle" fill="#38bdf8" font-family="Poppins, sans-serif" font-size="24" font-weight="500" letter-spacing="1">Contactless Login for Smart Campuses</text>
</svg>
